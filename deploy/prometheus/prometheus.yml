global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    # Without this the collector's own job label, which names the service the
    # metric came from, is renamed exported_job by the scrape job's label.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
