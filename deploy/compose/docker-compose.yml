name: go-admin-platform

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev_only_root
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready over the Unix socket (no -h) goes green against the
      # temporary socket-only server initdb scripts run under, before
      # roles exist; and a mid-script failure still leaves the final
      # server TCP-ready, so both checks must assert the end state.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres && psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='orders_user'\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  identity-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/identity/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      - "up"

  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      BCRYPT_COST: "12"
      SESSION_TTL: "24h"
      COOKIE_SECURE: "false"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
      MAX_REQUEST_BODY_BYTES: "1048576"
    ports:
      - "8081:8081"

  identity-seed:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile.seed
    profiles: ["seed"]
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      BCRYPT_COST: "12"
      OWNER_EMAIL: "${OWNER_EMAIL:-owner@example.com}"
      OWNER_PASSWORD: "${OWNER_PASSWORD:-dev_only_owner_password}"

  catalog-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/catalog/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://catalog_user:dev_only_catalog@postgres:5432/catalog_db?sslmode=disable"
      - "up"

  catalog:
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://catalog_user:dev_only_catalog@postgres:5432/catalog_db?sslmode=disable"
      S3_ENDPOINT: "minio:9000"
      S3_BUCKET: "catalog-images"
      S3_ACCESS_KEY: "dev_only_minio"
      S3_SECRET_KEY: "dev_only_minio_secret"
      S3_USE_SSL: "false"
      IMAGE_MAX_BYTES: "5242880"
      IMAGE_URL_TTL: "15m"
      PRODUCT_PAGE_SIZE_MAX: "100"
      DEFAULT_CURRENCY: "USD"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
    ports:
      - "8082:8082"

  orders-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/orders/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://orders_user:dev_only_orders@postgres:5432/orders_db?sslmode=disable"
      - "up"

  orders:
    build:
      context: ../..
      dockerfile: services/orders/Dockerfile
    depends_on:
      orders-migrate: { condition: service_completed_successfully }
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://orders_user:dev_only_orders@postgres:5432/orders_db?sslmode=disable"
    ports:
      - "8083:8083"

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      orders: { condition: service_healthy }
    environment:
      PORT: "8080"
      IDENTITY_URL: "http://identity:8081"
      CATALOG_URL: "http://catalog:8082"
      ORDERS_URL: "http://orders:8083"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
      PRINCIPAL_TTL: "30s"
      SESSION_CACHE_TTL: "${SESSION_CACHE_TTL:-10s}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
