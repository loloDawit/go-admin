# The Makefile overrides this per checkout via COMPOSE_PROJECT_NAME, which takes
# precedence. This name is what a bare `docker compose` command lands on.
name: go-admin-platform

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev_only_root
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready over the Unix socket (no -h) goes green against the
      # temporary socket-only server initdb scripts run under, before
      # roles exist; and a mid-script failure still leaves the final
      # server TCP-ready, so both checks must assert the end state.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres && psql -U postgres -tAc \"SELECT 1 FROM pg_roles WHERE rolname='orders_user'\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  identity-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/identity/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      - "up"

  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      BCRYPT_COST: "12"
      SESSION_TTL: "24h"
      COOKIE_SECURE: "false"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
      MAX_REQUEST_BODY_BYTES: "1048576"
    ports:
      - "8081:8081"

  identity-seed:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile.seed
    profiles: ["seed"]
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: "postgres://identity_user:dev_only_identity@postgres:5432/identity_db?sslmode=disable"
      BCRYPT_COST: "12"
      OWNER_EMAIL: "${OWNER_EMAIL:-owner@example.com}"
      OWNER_PASSWORD: "${OWNER_PASSWORD:-dev_only_owner_password}"

  minio:
    # docker.io/minio/minio now refuses anonymous pulls; quay.io is MinIO's other official mirror and stays open.
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: "dev_only_minio"
      MINIO_ROOT_PASSWORD: "dev_only_minio_secret"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 10

  # One-shot, following identity-migrate's shape: the bucket is an
  # infrastructure precondition, created before catalog starts rather than
  # by catalog itself on its own startup path.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 dev_only_minio dev_only_minio_secret &&
      mc mb --ignore-existing local/catalog-images
      "

  catalog-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/catalog/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://catalog_user:dev_only_catalog@postgres:5432/catalog_db?sslmode=disable"
      - "up"

  catalog:
    build:
      context: ../..
      dockerfile: services/catalog/Dockerfile
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://catalog_user:dev_only_catalog@postgres:5432/catalog_db?sslmode=disable"
      S3_ENDPOINT: "minio:9000"
      # A presigned URL is fetched by a browser on the host, which cannot
      # resolve the compose network's hostname.
      S3_PUBLIC_ENDPOINT: "localhost:9000"
      S3_BUCKET: "catalog-images"
      S3_ACCESS_KEY: "dev_only_minio"
      S3_SECRET_KEY: "dev_only_minio_secret"
      S3_USE_SSL: "false"
      IMAGE_MAX_BYTES: "5242880"
      IMAGE_URL_TTL: "15m"
      PRODUCT_PAGE_SIZE_MAX: "100"
      PRODUCT_RESOLVE_BATCH_MAX: "100"
      MAX_REQUEST_BODY_BYTES: "1048576"
      DEFAULT_CURRENCY: "USD"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
    ports:
      - "8082:8082"

  orders-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/orders/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://orders_user:dev_only_orders@postgres:5432/orders_db?sslmode=disable"
      - "up"

  orders:
    build:
      context: ../..
      dockerfile: services/orders/Dockerfile
    depends_on:
      orders-migrate: { condition: service_completed_successfully }
      catalog: { condition: service_healthy }
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://orders_user:dev_only_orders@postgres:5432/orders_db?sslmode=disable"
      CATALOG_URL: "http://catalog:8082"
      CATALOG_TIMEOUT: "2s"
      CATALOG_MAX_IDLE_CONNS: "20"
      ORDER_PAGE_SIZE_MAX: "100"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
    ports:
      - "8083:8083"

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    depends_on:
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      orders: { condition: service_healthy }
    environment:
      PORT: "8080"
      IDENTITY_URL: "http://identity:8081"
      CATALOG_URL: "http://catalog:8082"
      ORDERS_URL: "http://orders:8083"
      PRINCIPAL_SIGNING_KEY: "dev_only_principal_key_at_least_32_bytes"
      PRINCIPAL_TTL: "30s"
      SESSION_CACHE_TTL: "${SESSION_CACHE_TTL:-10s}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
