name: CI (services)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # make generate regenerates the typed API clients too, which needs npm.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make generate
      # Catalog's permission constants come from identity's published contract.
      # A diff here means the two have drifted, which is the failure §6.5 exists
      # to catch before a service enforces a permission the issuer never issues.
      - name: Generated code is current
        run: git diff --exit-code
      - run: make lint
      - run: go build ./services/... ./platform/...
      # Deliberately excludes test/integration: those tests carry
      # //go:build integration and need the compose stack from the
      # integration job below, not this Docker-free job.
      - run: go test ./services/... ./platform/... ./test/arch/... -count=1

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # ubuntu-latest ships a working Docker daemon; the stack and the
      # integration tests both need it. Do not move this job to a runner
      # without one.
      - run: docker compose -f deploy/compose/docker-compose.yml down -v
      - run: make up
      # The suite asserts against the seeded owner, and reads OWNER_* and
      # SESSION_CACHE_TTL from the environment rather than defaulting, so it
      # must run through the Makefile that defines them for compose too.
      - run: make seed
      # -tags integration is required: without it this matches zero test
      # files in test/integration and the job reports success having run
      # nothing.
      - run: make test-integration
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: docker compose -f deploy/compose/docker-compose.yml down -v
      # The gateway image builds the frontend into itself, so `make up` is what
      # publishes the app under test; there is no separate frontend server.
      - run: make up
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: apps/web/test-results
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs
