name: CI (services)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: make lint
      - run: go build ./services/... ./platform/...
      # Deliberately excludes test/integration: those tests carry
      # //go:build integration and need the compose stack from the
      # integration job below, not this Docker-free job.
      - run: go test ./services/... ./platform/... ./test/arch/... -count=1

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # ubuntu-latest ships a working Docker daemon; the stack and the
      # integration tests both need it. Do not move this job to a runner
      # without one.
      - run: docker compose -f deploy/compose/docker-compose.yml down -v
      - run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      # -tags integration is required: without it this matches zero test
      # files in test/integration and the job reports success having run
      # nothing.
      - run: go test -tags integration ./test/integration/... -count=1 -v
      - if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs
