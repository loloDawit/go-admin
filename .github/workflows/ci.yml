name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Format check
        run: make gofmtcheck

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The suite spins up MySQL via testcontainers, which needs a live
      # Docker daemon — ubuntu-latest provides one; do not switch runners.
      - name: Test
        run: go test ./... -count=1

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
